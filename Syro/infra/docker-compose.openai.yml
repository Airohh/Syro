# Profil pour utiliser OpenAI (cloud, payant)

services:
  # Override API pour utiliser OpenAI
  syro-api:
    environment:
      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

