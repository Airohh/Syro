[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=app
    --cov=worker
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    # --cov-fail-under=60  # Désactivé temporairement pour éviter les échecs de coverage
# asyncio_mode = auto  # Désactivé temporairement à cause d'un bug avec pytest-asyncio
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    security: Security-related tests
    worker: Worker/Celery tests

