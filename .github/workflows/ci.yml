name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Syro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Syro/requirements*.txt
      # Pas de torch : les tests simulent le reranker (requirements-ml.txt non requis).
      - run: pip install -r requirements-dev.txt
      - name: Tests (sans service externe ; Qdrant en mode mémoire)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest -q
      - name: Intégrité du golden set
        run: python evaluation/validate_golden_set.py

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Syro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.1.9 black==24.4.2
      - run: ruff check app worker scripts
      - run: black --check app worker scripts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Syro/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Syro/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
