name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./Syro
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run lean test suite
      working-directory: ./Syro
      env:
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"
      run: pytest tests/ -v --tb=short

    - name: Golden set integrity gate (T1.4)
      working-directory: ./Syro
      run: python evaluation/validate_golden_set.py

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    
    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black mypy
    
    - name: Run Ruff
      working-directory: ./Syro
      run: ruff check app/ worker/

    - name: Check code formatting with Black
      working-directory: ./Syro
      run: black --check app/ worker/

